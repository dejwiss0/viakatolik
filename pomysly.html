<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pomysły – VIA KATOLIK</title>
    <link rel="icon" href="assets/logo-kolor.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="w">
    <a class="logo" href="index.html" aria-label="VIA KATOLIK – start"><img src="assets/logo-kolor.png" alt="VIA KATOLIK"></a>
    <button id="mb" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Główna">
      <a href="index.html">Start</a>
      <a href="program.html">Program</a>
      <a href="pomysly.html" class="on" aria-current="page">Pomysły</a>
      <a href="ankiety.html">Ankiety</a>
      <a href="o-nas.html">O nas</a>
    </nav>
  </div>
</header>
<main>
<section class="ph"><div class="w"><h1>Twoje <span class="hl">pomysły</span></h1><p class="lead">Zgłoś propozycję i śledź jej status.</p></div></section>
<section class="s" id="form"><div class="w grid two"><div><h2>Zgłoś <span class="hl">pomysł</span></h2><p>Opisz krótko, o co chodzi i po co.</p></div>
<form id="f"><label>Tytuł pomysłu<input name="t" required maxlength="80"></label>
<label>Opis<textarea name="d" required maxlength="500"></textarea></label>
<label>Kategoria<select name="c"><option>Wydarzenia</option><option>Dni tematyczne</option><option>Modlitwa i Msze</option><option>Szkoła i organizacja</option><option>Inne</option></select></label>
<label>Imię lub klasa (opcjonalnie)<input name="a" maxlength="40"></label>
<button class="btn" type="submit">Wyślij pomysł</button><p class="note" id="m" role="status"></p></form></div></section>

<section class="s t" id="tablica"><div class="w"><h2>Tablica <span class="hl">statusów</span></h2>
<div class="fl" id="fl"><button class="on" data-s="">Wszystkie</button><button data-s="Zgłoszony">Zgłoszone</button><button data-s="W głosowaniu">W głosowaniu</button><button data-s="W realizacji">W realizacji</button><button data-s="Zrealizowany">Zrealizowane</button></div>
<div class="grid three" id="b"></div></div></section></main>

<footer><div class="w"><img src="assets/logo-biel.png" alt="VIA KATOLIK" style="height:64px;width:auto"><span>Samorząd uczniowski szkoły katolickiej</span><span><a href="pomysly.html">Zgłoś pomysł</a></span></div></footer>

<script>
// Unikalny identyfikator urządzenia do obsługi polubień
let userId = localStorage.getItem('viakatolik_user_id');
if (!userId) {
  userId = 'user_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
  localStorage.setItem('viakatolik_user_id', userId);
}

const SUPABASE_URL = 'https://vbohrgapyspzbmjccasw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_54BBj6DVIkUKCyunEWggSA_Q9etozpc';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const b = document.getElementById('mb'), n = document.getElementById('nav');
b.onclick = () => { b.setAttribute('aria-expanded', n.classList.toggle('open')); };

const C = {"Zgłoszony":"n","W głosowaniu":"v","W realizacji":"w","Zrealizowany":"z"};
const board = document.getElementById('b'); 
let currentFilter = "";

const e = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function loadIdeas() {
  const { data, error } = await db.from('ideas').select('*').eq('is_approved', true).order('created_at', { ascending: false });
  if (error) { board.innerHTML = "<p>Błąd ładowania danych.</p>"; return; }
  
  const filtered = data.filter(x => !currentFilter || x.status === currentFilter);
  board.innerHTML = filtered.map(x => {
    const isLiked = localStorage.getItem('liked_' + x.id) === 'true';
    return `
      <article class="card">
        <span class="st ${C[x.status] || 'n'}">${e(x.status)}</span>
        <h3>${e(x.title)}</h3>
        <p>${e(x.description)}</p>
        <span class="tag">${e(x.category)}</span>
        ${x.author ? `<p class="note">Zgłosił(a): ${e(x.author)}</p>` : ''}
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
          <button class="btn o" onclick="likeIdea(${x.id})" ${isLiked ? 'style="background: var(--l); color: var(--d);"' : ''}>
            ❤️ Polub (${x.likes_count || 0})
          </button>
        </div>
      </article>
    `;
  }).join('') || "<p>Brak zaakceptowanych pomysłów w tym statusie.</p>";
}

document.getElementById('fl').onclick = ev => {
  if (ev.target.dataset.s === undefined) return;
  currentFilter = ev.target.dataset.s;
  document.querySelectorAll('#fl button').forEach(x => x.classList.toggle('on', x === ev.target));
  loadIdeas();
};

document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();

  // Sprawdzenie 2-minutowego limitu (120000 ms)
  const lastSubmission = localStorage.getItem('last_idea_time');
  const now = Date.now();
  const cooldownTime = 120000; 

  const msg = document.getElementById('m');

  if (lastSubmission && (now - lastSubmission < cooldownTime)) {
    const timeLeft = Math.ceil((cooldownTime - (now - lastSubmission)) / 1000);
    msg.textContent = `Musisz odczekać jeszcze ${timeLeft} sekund przed wysłaniem kolejnego pomysłu.`;
    return;
  }

  const d = new FormData(ev.target);
  msg.textContent = "Wysyłanie...";

  const { error } = await db.from('ideas').insert([{
    title: d.get('t'),
    description: d.get('d'),
    category: d.get('c'),
    author: d.get('a'),
    likes_count: 0
  }]);

  if (error) {
    msg.textContent = "Wystąpił błąd podczas wysyłania zgłoszenia.";
  } else {
    localStorage.setItem('last_idea_time', Date.now());
    ev.target.reset();
    msg.textContent = "Dziękujemy! Pomysł został wysłany i czeka na akceptację przez samorząd.";
    loadIdeas();
  }
};

async function likeIdea(id) {
  const likedKey = 'liked_' + id;
  if (localStorage.getItem(likedKey) === 'true') {
    alert("Już polubiłeś ten pomysł!");
    return;
  }

  const { data: current, error: fetchError } = await db
    .from('ideas')
    .select('likes_count')
    .eq('id', id)
    .single();

  if (fetchError) return;

  const newCount = (current.likes_count || 0) + 1;

  const { error: updateError } = await db
    .from('ideas')
    .update({ likes_count: newCount })
    .eq('id', id);

  if (!updateError) {
    localStorage.setItem(likedKey, 'true');
    loadIdeas();
  }
}

loadIdeas();
</script>
</body>
</html>
